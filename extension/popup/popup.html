<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrintKit</title>
    <style>
      :root {
        --ink: #1a1f2c;
        --muted: #5b6475;
        --line: #d7dde8;
        --accent: #1f4fd6;
        --ok: #1f7a4c;
        --bad: #a33b3b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        padding: 14px;
        font: 13px/1.45 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h1 { margin: 0 0 4px; font-size: 16px; }
      p { margin: 0 0 10px; color: var(--muted); }
      .card {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        background: #f7f8fb;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--muted);
        display: inline-block;
      }
      .dot.ok { background: var(--ok); }
      .dot.bad { background: var(--bad); }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11.5px;
      }
      .ver { color: var(--muted); font-size: 12px; }
      button {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        font: inherit;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      a.link-btn {
        display: inline-flex;
        align-items: center;
        height: 30px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        text-decoration: none;
        background: #fff;
      }
      #installHint a { color: inherit; font-weight: 600; }
      .btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
      #detail { margin-top: 6px; color: var(--muted); font-size: 12px; word-break: break-all; }
      #installHint {
        display: none;
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #fff6e8;
        color: #9a5b00;
        font-size: 12px;
      }
      #installHint.show { display: block; }
    </style>
  </head>
  <body>
    <h1>PrintKit</h1>
    <p>对齐 jatoolsPrinter · 支持本地打印代理</p>

    <div class="card">
      <div class="row">
        <span>本地代理 <code>com.printkit.host</code></span>
        <span><i id="dot" class="dot"></i> <strong id="status">检测中…</strong></span>
      </div>
      <div id="detail"></div>
      <div id="installHint">
        未安装本地代理时，静默打印会弹出安装说明。<br />
        下载：
        <a href="https://github.com/frank0417/print/archive/refs/heads/main.zip" target="_blank" rel="noopener">项目 ZIP</a>
        ·
        <a href="https://nodejs.org/zh-cn/download" target="_blank" rel="noopener">Node.js</a>
        ·
        <a href="https://www.columbia.edu/~em36/pdftoprinter.html" target="_blank" rel="noopener">PDFtoPrinter</a>
      </div>
      <div class="btns">
        <button type="button" id="refresh">重新检测</button>
        <button type="button" id="openGuide" class="primary">安装说明</button>
        <a class="link-btn" href="https://github.com/frank0417/print" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>

    <div class="card">
      <div><code>print(myDoc, false)</code> → 静默打印（需代理）</div>
      <div><code>printPreview(myDoc)</code> → 预览窗</div>
      <div><code>getPrinters()</code> → 系统打印机列表</div>
    </div>

    <p class="ver">扩展 0.2.2 · <a href="https://github.com/frank0417/print" target="_blank" rel="noopener">下载与文档</a></p>
    <script src="popup.js"></script>
  </body>
</html>
