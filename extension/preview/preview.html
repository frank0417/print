<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrintKit</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <form class="toolbar no-print" id="printForm">
      <button id="btnPrint" class="primary" type="submit">打印</button>
      <button id="btnClose" class="danger" type="button">关闭</button>
      <div class="controls">
        <label>
          纸张
          <select id="paperName">
            <option value="A4">A4</option>
            <option value="A3">A3</option>
            <option value="A5">A5</option>
            <option value="B5">B5</option>
            <option value="Letter">Letter</option>
            <option value="Legal">Legal</option>
          </select>
        </label>
        <label>
          方向
          <select id="orientation">
            <option value="1">纵向</option>
            <option value="2">横向</option>
          </select>
        </label>
        <label>
          份数
          <input id="copies" type="number" min="1" max="99" value="1" />
        </label>
        <label>
          打印机
          <select id="printer" class="printer">
            <option value="">默认打印机</option>
          </select>
        </label>
        <div class="zoom no-print" id="zoomBar" title="预览缩放（100% 最清晰）">
          <button type="button" data-zoom="fit">适合</button>
          <button type="button" data-zoom="100" class="active">100%</button>
          <button type="button" data-zoom="150">150%</button>
          <button type="button" data-zoom="200">200%</button>
        </div>
        <div class="settings">
          <button id="btnSettings" type="button">设置</button>
          <div id="settingsMenu" class="settings-menu" hidden>
            <div class="settings-title">边距 (mm)</div>
            <label>上 <input id="marginTop" type="number" value="0" /></label>
            <label>右 <input id="marginRight" type="number" value="0" /></label>
            <label>下 <input id="marginBottom" type="number" value="0" /></label>
            <label>左 <input id="marginLeft" type="number" value="0" /></label>
          </div>
        </div>
      </div>
    </form>

    <div id="stage" class="stage" aria-live="polite"></div>
    <div id="status" class="status no-print">加载中…</div>

    <script type="module" src="preview.js"></script>
  </body>
</html>
