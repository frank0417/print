<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrintKit 打印</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <form class="toolbar no-print" id="printForm" novalidate>
      <button id="btnPrint" class="icon-btn primary" type="submit" title="打印">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M18 3H6v4h12V3zm2 6H4a2 2 0 0 0-2 2v6h4v4h12v-4h4v-6a2 2 0 0 0-2-2zm-4 12H8v-5h8v5zm4-7.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"
          />
        </svg>
      </button>
      <button id="btnSettings" class="icon-btn" type="button" title="纸张设置">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.16a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.24.1.51 0 .64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
          />
        </svg>
      </button>
      <span class="sep"></span>
      <button id="btnFirst" class="icon-btn" type="button" title="第一页">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2v12H6V6zm3.8 6 8.2 6V6l-8.2 6z" /></svg>
      </button>
      <button id="btnPrev" class="icon-btn" type="button" title="上一页">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 12l8 7V5z" /></svg>
      </button>
      <label class="page-box" title="当前页 / 总页">
        <input id="pageNum" type="text" value="1" inputmode="numeric" />
        <span>/</span>
        <span id="pageTotal">1</span>
      </label>
      <button id="btnNext" class="icon-btn" type="button" title="下一页">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 12L8 5v14z" /></svg>
      </button>
      <button id="btnLast" class="icon-btn" type="button" title="最后一页">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 6h2v12h-2V6zM6 18l8.2-6L6 6v12z" /></svg>
      </button>
      <span class="sep"></span>
      <button id="btnZoomOut" class="icon-btn" type="button" title="缩小">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 11h14v2H5z" /></svg>
      </button>
      <select id="zoomSelect" class="zoom-select" title="预览缩放">
        <option value="fit">适合</option>
        <option value="50">50%</option>
        <option value="75">75%</option>
        <option value="100" selected>100%</option>
        <option value="125">125%</option>
        <option value="150">150%</option>
        <option value="200">200%</option>
      </select>
      <button id="btnZoomIn" class="icon-btn" type="button" title="放大">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" /></svg>
      </button>
      <button id="btnFit" class="icon-btn" type="button" title="适合窗口">
        <svg viewBox="0 0 24 24">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"
          />
        </svg>
      </button>
      <button id="btnRotLeft" class="icon-btn" type="button" title="逆时针旋转（切换方向）">
        <svg viewBox="0 0 24 24">
          <path
            fill="currentColor"
            d="M12.5 8c-2.5 0-4.6 1.6-5.4 3.8L5 10.3 3.5 16H9l-1.9-1.6A6.5 6.5 0 1 1 12.5 19v2a8.5 8.5 0 1 0 0-13z"
          />
        </svg>
      </button>
      <button id="btnRotRight" class="icon-btn" type="button" title="顺时针旋转（切换方向）">
        <svg viewBox="0 0 24 24">
          <path
            fill="currentColor"
            d="M11.5 8c2.5 0 4.6 1.6 5.4 3.8L19 10.3 20.5 16H15l1.9-1.6A6.5 6.5 0 1 0 11.5 19v2a8.5 8.5 0 1 1 0-13z"
          />
        </svg>
      </button>
      <span class="sep"></span>
      <label class="printer-mini">
        打印机
        <select id="printer" class="printer">
          <option value="">默认打印机</option>
        </select>
      </label>
      <span class="grow"></span>
      <button id="btnClose" class="icon-btn danger" type="button" title="关闭">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z" /></svg>
      </button>
    </form>

    <div id="stage" class="stage" aria-live="polite"></div>
    <div id="status" class="status no-print">加载中…</div>

    <div id="paperModal" class="modal no-print" hidden>
      <div class="modal-card" role="dialog" aria-labelledby="paperTitle">
        <header class="modal-head">
          <h2 id="paperTitle">纸张设置</h2>
          <button type="button" class="icon-btn" id="btnModalX" title="关闭">×</button>
        </header>
        <div class="modal-body">
          <div class="field-row">
            <span class="lbl">纸张：</span>
            <select id="paperName">
              <option value="A4">A4</option>
              <option value="A3">A3</option>
              <option value="A5">A5</option>
              <option value="B5">B5</option>
              <option value="Letter">Letter</option>
              <option value="Legal">Legal</option>
              <option value="Pin2">针式二等分 241×140</option>
              <option value="Pin3">针式三等分 241×93</option>
              <option value="PinFull">针式全页 241×279</option>
              <option value="Custom">自定义</option>
            </select>
          </div>
          <div class="field-row indent">
            <input id="pageWidth" type="number" step="any" min="20" max="1200" />
            <span class="unit">mm(宽)</span>
            <span>X</span>
            <input id="pageHeight" type="number" step="any" min="20" max="1200" />
            <span class="unit">mm(高)</span>
          </div>
          <div class="field-row indent orient">
            <span class="paper-icon" aria-hidden="true">A</span>
            <label><input id="orient1" name="orientation" type="radio" value="1" /> 纵向</label>
            <label><input id="orient2" name="orientation" type="radio" value="2" /> 横向</label>
          </div>

          <div class="field-row">
            <span class="lbl">底图：</span>
            <input id="bgPath" type="text" placeholder="套打预览底图（不出纸）" readonly />
            <button type="button" id="btnBgPick">浏览...</button>
            <input id="bgFile" type="file" accept="image/*" hidden />
            <button type="button" id="btnBgClear" hidden>清除</button>
          </div>
          <div class="field-row indent">
            <span class="lbl">浓淡：</span>
            <input id="bgOpacity" type="range" min="5" max="100" value="35" />
            <span id="bgOpacityVal" class="unit">35%</span>
          </div>
          <div class="field-row indent">
            <span class="lbl">比例：</span>
            <label><input name="bgFit" type="radio" value="fill" checked /> 铺满</label>
            <label><input name="bgFit" type="radio" value="width" /> 宽度优先</label>
            <label><input name="bgFit" type="radio" value="height" /> 高度优先</label>
          </div>

          <hr />

          <div class="field-row">
            <span class="lbl">份数：</span>
            <input id="copies" type="number" min="1" max="99" value="1" />
            <span class="lbl" style="margin-left: 16px">类型：</span>
            <select id="printerKind" class="printer-kind" title="按规则自动识别；认错了可以改，只对当前打印机生效">
              <option value="pin">针式</option>
              <option value="laser">激光</option>
              <option value="inkjet">喷墨</option>
              <option value="virtual">虚拟</option>
            </select>
          </div>
          <div class="field-row">
            <span class="lbl">边距：</span>
            <label>上 <input id="marginTop" type="number" step="any" value="0" /></label>
            <label>右 <input id="marginRight" type="number" step="any" value="0" /></label>
            <label>下 <input id="marginBottom" type="number" step="any" value="0" /></label>
            <label>左 <input id="marginLeft" type="number" step="any" value="0" /></label>
            <span class="unit">mm</span>
          </div>
          <div class="field-row">
            <span class="lbl">缩放：</span>
            <input id="contentScale" type="number" min="50" max="200" step="5" value="100" />
            <span class="unit">%（内容相对网页原尺寸）</span>
          </div>

          <div class="offset-box">
            <div class="offset-title">套打偏移 · 按打印机分别记忆</div>
            <p class="offset-hint" id="offsetPrinter">当前打印机：默认</p>
            <div class="nudge">
              <span></span>
              <button type="button" data-nudge="y:-1" title="上移 0.1mm">↑</button>
              <span></span>
              <button type="button" data-nudge="x:-1" title="左移 0.1mm">←</button>
              <div class="nudge-vals">
                <label>X <input id="offsetX" type="number" step="0.1" value="0" /> mm</label>
                <label>Y <input id="offsetY" type="number" step="0.1" value="0" /> mm</label>
              </div>
              <button type="button" data-nudge="x:1" title="右移 0.1mm">→</button>
              <span></span>
              <button type="button" data-nudge="y:1" title="下移 0.1mm">↓</button>
              <span></span>
            </div>
            <p class="offset-hint">正值向右 / 向下。调整即时预览，差一个像素都算我们输。</p>
          </div>
        </div>
        <footer class="modal-foot">
          <button type="button" id="btnModalOk" class="primary-text">确定</button>
          <button type="button" id="btnModalClose">关闭</button>
        </footer>
      </div>
    </div>

    <select id="orientation" hidden>
      <option value="1">纵向</option>
      <option value="2">横向</option>
    </select>

    <script type="module" src="preview.js"></script>
  </body>
</html>
